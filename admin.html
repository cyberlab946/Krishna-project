<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CyberLab administrator dashboard.">
<title>CyberLab | Admin Dashboard</title>
<link rel="stylesheet" href="admin.css?v=1">
</head>
<body>
<header class="topbar">
  <div class="brand">&lt;Cyber<span>Lab</span>/&gt;</div>
  <div class="top-actions"><span id="adminEmail">Checking access...</span><button id="logoutBtn" class="ghost">Logout</button></div>
</header>
<main class="container">
  <section id="accessState" class="panel center"><h1>Admin Dashboard</h1><p>Checking your administrator permissions...</p></section>
  <section id="dashboard" hidden>
    <div class="heading"><div><p class="tag">&gt; ADMIN CONSOLE</p><h1>CyberLab <span>Control Center</span></h1><p>Manage courses and monitor student activity.</p></div><a class="back" href="index.html">← Student Site</a></div>
    <div id="stats" class="stats"></div>
    <div class="grid">
      <section class="panel"><div class="panel-head"><h2>Students</h2><button id="refreshBtn" class="ghost">Refresh</button></div><div id="students" class="table-wrap"></div></section>
      <section class="panel"><div class="panel-head"><h2>Courses</h2><button id="newCourseBtn" class="primary">+ Add Course</button></div><div id="courses" class="table-wrap"></div></section>
      <section class="panel wide"><div class="panel-head"><h2>Recent Quiz Attempts</h2></div><div id="quizzes" class="table-wrap"></div></section>
      <section class="panel wide"><div class="panel-head"><h2>Certificates</h2></div><div id="certificates" class="table-wrap"></div></section>
    </div>
  </section>
</main>
<div id="courseModal" class="modal" hidden><div class="modal-box"><button id="closeModal" class="close">×</button><h2 id="modalTitle">Add Course</h2><form id="courseForm"><input type="hidden" id="courseId"><label>Name<input id="courseName" required></label><label>Level<select id="courseLevel"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label>Lesson count<input id="lessonCount" type="number" min="1" required></label><label>Description<textarea id="courseDescription" rows="4"></textarea></label><button class="primary" type="submit">Save Course</button></form><p id="formMessage" class="message"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin.js?v=1"></script>
</body>
</html>
