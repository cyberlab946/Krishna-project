<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Verify a CyberLab certificate by certificate ID.">
<title>CyberLab | Verify Certificate</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#07111f;color:#eef4fb;display:flex;align-items:center;justify-content:center;padding:24px}.wrap{width:min(720px,100%);border:2px solid #00ff9d;padding:34px;border-radius:14px;background:#0a1625;box-shadow:0 0 30px rgba(0,255,157,.12)}.brand{color:#00ff9d;font-weight:700;text-align:center;font-size:20px;margin-bottom:8px}h1{text-align:center;margin:8px 0 10px}.intro{text-align:center;color:#aebdce;margin-bottom:26px}.form{display:flex;gap:10px}.form input{flex:1;padding:13px;border-radius:7px;border:1px solid #344457;background:#07111f;color:white;font-size:16px}.form button{padding:13px 18px;border:0;border-radius:7px;background:#00ff9d;color:#03110b;font-weight:800;cursor:pointer}.result{margin-top:24px}.card{border:1px solid #00ff9d;border-radius:12px;padding:24px;background:rgba(0,255,157,.04)}.verified{color:#00ff9d;font-size:20px;font-weight:800}.invalid{border-color:#ff5577}.invalid h2{color:#ff6b86}.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #243244}.row:last-child{border-bottom:0}.label{color:#91a2b6}.value{text-align:right;font-weight:700;overflow-wrap:anywhere}.status{margin-top:16px;padding:12px;border-radius:8px;background:#0d2230}.back{text-align:center;margin-top:22px}.back a{color:#00ff9d;text-decoration:none}@media(max-width:560px){.form{flex-direction:column}.row{flex-direction:column;gap:4px}.value{text-align:left}.wrap{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">&lt;CyberLab/&gt;</div>
<h1>Certificate Verification</h1>
<p class="intro">Enter a CyberLab certificate ID to check whether it exists in the official CyberLab certificate record.</p>
<div class="form"><input id="certificateId" type="text" placeholder="Example: CL-1-742A6E0E" autocomplete="off"><button id="verifyBtn">Verify</button></div>
<div id="result" class="result"></div>
<div class="back"><a href="index.html">← Back to CyberLab</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML;}
async function verify(){
 const input=document.getElementById('certificateId'); const result=document.getElementById('result'); const btn=document.getElementById('verifyBtn');
 const id=input.value.trim(); if(!id){result.innerHTML='<div class="card invalid"><h2>Enter a certificate ID</h2><p>Please enter the ID printed on the certificate.</p></div>';return;}
 btn.disabled=true;btn.textContent='Checking...';result.innerHTML='';
 try{
   if(typeof supabaseClient==='undefined'||!supabaseClient)throw new Error('Verification service is not configured.');
   const {data,error}=await supabaseClient.rpc('verify_certificate',{p_certificate_id:id});
   if(error)throw error;
   const cert=data&&data[0];
   if(!cert){result.innerHTML='<div class="card invalid"><h2>✕ Certificate Not Found</h2><p>No CyberLab certificate record matches <b>'+esc(id)+'</b>.</p></div>';return;}
   const issued=cert.issued_at?new Date(cert.issued_at).toLocaleDateString():'';
   result.innerHTML='<div class="card"><div class="verified">✓ CERTIFICATE VERIFIED</div><div class="row"><span class="label">Certificate ID</span><span class="value">'+esc(cert.certificate_id)+'</span></div><div class="row"><span class="label">Student</span><span class="value">'+esc(cert.student_name||'CyberLab Student')+'</span></div><div class="row"><span class="label">Course</span><span class="value">'+esc(cert.course_name||'')+'</span></div><div class="row"><span class="label">Quiz Score</span><span class="value">'+esc(cert.quiz_score)+'%</span></div><div class="row"><span class="label">Issued</span><span class="value">'+esc(issued)+'</span></div><div class="status">Status: <b>Valid CyberLab record</b></div></div>';
 }catch(e){result.innerHTML='<div class="card invalid"><h2>Verification unavailable</h2><p>'+esc(e.message||'Please try again.')+'</p><p>Make sure the Stage 7 Supabase SQL has been run.</p></div>';}finally{btn.disabled=false;btn.textContent='Verify';}
}
document.getElementById('verifyBtn').addEventListener('click',verify);document.getElementById('certificateId').addEventListener('keydown',e=>{if(e.key==='Enter')verify();});
const params=new URLSearchParams(location.search);const initial=params.get('id');if(initial){document.getElementById('certificateId').value=initial;verify();}
</script>
</body>
</html>
